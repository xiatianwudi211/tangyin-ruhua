/* ============ 通用缩放 / 平移组件 ============ */
function zoomable(stage, contentEl, contain, minScale) {
  minScale = minScale || 1;
  let s = 1, tx = 0, ty = 0, suppressClick = false;
  let viewW = stage.clientWidth;
  let viewH = stage.clientHeight;
  const img = contentEl.querySelector("img");
  // 基础显示尺寸：fill=铺满容器宽（画卷）；contain=整件放入舞台（详情乐器）
  let baseW = 1, baseH = 1;
  function compute() {
    // 实时读取舞台尺寸：初始化时元素可能尚未布局（clientHeight=0），图片加载/布局变化后需重算
    viewW = stage.clientWidth;
    viewH = stage.clientHeight;
    const natA = (img && img.naturalWidth) ? (img.naturalHeight / img.naturalWidth) : 1;
    if (contain) {
      baseW = viewH / natA;
      if (baseW > viewW) baseW = viewW;
      baseH = baseW * natA;
      if (baseH > viewH) { baseH = viewH; baseW = baseH / natA; }
    } else {
      baseW = viewW; baseH = baseW * natA;
    }
    contentEl.style.width = baseW + "px";
  }
  compute();
  const apply = () => { contentEl.style.transform = "translate(" + tx + "px," + ty + "px) scale(" + s + ")"; };
  /* 边界夹取可作用于任意一组 (scale,x,y)：先夹「目标」再缓动，避免 tween 撞边界永远不收敛 */
  const clampVals = (sc, x, y) => {
    const W = baseW * sc, H = baseH * sc;
    return {
      x: Math.max((W > viewW ? viewW - W : 0), Math.min((W > viewW ? 0 : (viewW - W) / 2), x)),
      y: Math.max((H > viewH ? viewH - H : 0), Math.min((H > viewH ? 0 : (viewH - H) / 2), y))
    };
  };
  const clamp = () => { const c = clampVals(s, tx, ty); tx = c.x; ty = c.y; };

  /* 平滑缩放：按钮 / 滚轮 / 双击只更新目标，rAF 指数趋近；连续输入不排队、不跳帧 */
  const reduced = window.matchMedia('(prefers-reduced-motion: reduce)').matches;
  let goalS = 1, goalTX = 0, goalTY = 0, tweenRaf = 0, tweenLast = 0;
  let flingRaf = 0, flingLast = 0, flingVX = 0, flingVY = 0;
  function stopAnim() {
    if (tweenRaf) { cancelAnimationFrame(tweenRaf); tweenRaf = 0; }
    if (flingRaf) { cancelAnimationFrame(flingRaf); flingRaf = 0; }
    tweenLast = 0; flingLast = 0; flingVX = 0; flingVY = 0;
  }
  function syncGoal() { goalS = s; goalTX = tx; goalTY = ty; }
  function tweenStep(now) {
    tweenRaf = 0;
    const dt = tweenLast ? Math.min(0.05, (now - tweenLast) / 1000) : 1 / 60;
    tweenLast = now;
    const a = 1 - Math.exp(-dt / 0.07);
    s += (goalS - s) * a;
    tx += (goalTX - tx) * a;
    ty += (goalTY - ty) * a;
    clamp(); apply();
    if (Math.abs(goalS - s) > 0.0008 || Math.abs(goalTX - tx) > 0.15 || Math.abs(goalTY - ty) > 0.15) {
      tweenRaf = requestAnimationFrame(tweenStep);
    } else { s = goalS; tx = goalTX; ty = goalTY; clamp(); apply(); tweenLast = 0; }
  }
  function wakeTween() {
    if (flingRaf) { cancelAnimationFrame(flingRaf); flingRaf = 0; flingLast = 0; flingVX = 0; flingVY = 0; }
    if (reduced) { s = goalS; tx = goalTX; ty = goalTY; clamp(); apply(); return; }
    if (!tweenRaf) { tweenLast = 0; tweenRaf = requestAnimationFrame(tweenStep); }
  }
  function flingStep(now) {
    flingRaf = 0;
    const dt = flingLast ? Math.min(0.032, (now - flingLast) / 1000) : 1 / 60;
    flingLast = now;
    tx += flingVX * dt; ty += flingVY * dt;
    clamp(); apply(); syncGoal();
    const decay = Math.exp(-dt / 0.16);
    flingVX *= decay; flingVY *= decay;
    if (Math.abs(flingVX) > 8 || Math.abs(flingVY) > 8) flingRaf = requestAnimationFrame(flingStep);
    else flingLast = 0;
  }

  const fit = () => {
    stopAnim(); compute();
    s = 1;
    tx = (baseW > viewW ? 0 : (viewW - baseW) / 2);
    ty = (baseH > viewH ? 0 : (viewH - baseH) / 2);
    clamp(); apply(); syncGoal();
  };
  const zoomAt = (f, cx, cy) => {
    const ns = Math.max(minScale, Math.min(8, goalS * f));
    const c = clampVals(ns,
      cx - (cx - goalTX) * (ns / goalS),
      cy - (cy - goalTY) * (ns / goalS));
    goalS = ns; goalTX = c.x; goalTY = c.y;
    wakeTween();
  };
  /* 双指手势走即时通道，避免缓动带来的跟手延迟 */
  const zoomNow = (f, cx, cy) => {
    stopAnim();
    const ns = Math.max(minScale, Math.min(8, s * f));
    tx = cx - (cx - tx) * (ns / s);
    ty = cy - (cy - ty) * (ns / s);
    s = ns; clamp(); apply(); syncGoal();
  };
  const rect = () => stage.getBoundingClientRect();

  // 滚轮缩放
  stage.addEventListener("wheel", (e) => {
    e.preventDefault();
    const r = rect();
    zoomAt(e.deltaY < 0 ? 1.16 : 1 / 1.16, e.clientX - r.left, e.clientY - r.top);
  }, { passive: false });

  // 指针拖动 + 双指缩放
  const pointers = {};
  let lastDist = 0, dragging = false;
  let startX = 0, startY = 0, startTX = 0, startTY = 0;
  let lastPX = 0, lastPY = 0, lastPT = 0, moveVX = 0, moveVY = 0;

  stage.addEventListener("pointerdown", (e) => {
    stopAnim();
    pointers[e.pointerId] = { x: e.clientX, y: e.clientY };
    if (Object.keys(pointers).length === 1) {
      dragging = true; suppressClick = false;
      startX = e.clientX; startY = e.clientY; startTX = tx; startTY = ty;
      lastPX = e.clientX; lastPY = e.clientY; lastPT = performance.now();
      moveVX = 0; moveVY = 0;
    }
    lastDist = 0;
  });
  stage.addEventListener("pointermove", (e) => {
    if (!(e.pointerId in pointers)) return;
    pointers[e.pointerId] = { x: e.clientX, y: e.clientY };
    const ids = Object.keys(pointers);
    if (ids.length >= 2) {
      const p0 = pointers[ids[0]], p1 = pointers[ids[1]];
      const d = Math.hypot(p1.x - p0.x, p1.y - p0.y);
      const mx = (p0.x + p1.x) / 2, my = (p0.y + p1.y) / 2;
      const r = rect();
      if (lastDist > 0) zoomNow(d / lastDist, mx - r.left, my - r.top);
      lastDist = d;
      dragging = false;
    } else if (dragging) {
      const now = performance.now();
      const dt = Math.max(0.008, (now - lastPT) / 1000);
      moveVX = moveVX * 0.6 + ((e.clientX - lastPX) / dt) * 0.4;
      moveVY = moveVY * 0.6 + ((e.clientY - lastPY) / dt) * 0.4;
      lastPX = e.clientX; lastPY = e.clientY; lastPT = now;
      const dx = e.clientX - startX, dy = e.clientY - startY;
      if (Math.abs(dx) + Math.abs(dy) > 3) suppressClick = true;
      tx = startTX + dx; ty = startTY + dy; clamp(); apply(); syncGoal();
    }
  });
  const up = (e) => {
    delete pointers[e.pointerId];
    const n = Object.keys(pointers).length;
    if (n < 2) lastDist = 0;
    if (n === 0 && dragging) {
      dragging = false;
      /* 甩动惯性：仅在放大状态下、且松手前仍有速度时启用 */
      if (!reduced && s > 1.02 && performance.now() - lastPT < 90) {
        flingVX = Math.max(-2200, Math.min(2200, moveVX));
        flingVY = Math.max(-2200, Math.min(2200, moveVY));
        if (Math.abs(flingVX) > 60 || Math.abs(flingVY) > 60) {
          flingLast = 0; if (!flingRaf) flingRaf = requestAnimationFrame(flingStep);
        }
      }
    }
  };
  stage.addEventListener("pointerup", up);
  stage.addEventListener("pointercancel", up);
  // 拖拽后抑制误触发的点击
  stage.addEventListener("click", (e) => {
    if (suppressClick) { e.preventDefault(); e.stopPropagation(); suppressClick = false; }
  }, true);
  /* 双击：在 1× 与 2.2× 之间以指针位置为锚点平滑切换 */
  stage.addEventListener("dblclick", (e) => {
    e.preventDefault();
    const r = rect();
    zoomAt(goalS > 1.6 ? 1 / goalS : 2.2 / goalS, e.clientX - r.left, e.clientY - r.top);
  });

  if (img && !img.complete) {
    img.addEventListener("load", () => { fit(); }, { once: true });
  }
  fit();
  // 下一帧布局完成后再 fit 一次，兜底初始化时舞台尺寸为 0 的情况
  requestAnimationFrame(() => requestAnimationFrame(() => fit()));
  // 乐器大图后到：naturalWidth 就绪后重算基准尺寸并复位，避免显示为 0/错位
  if (img && !img.complete) img.addEventListener('load', () => fit(), { once: true });
  return {
    zoomIn: () => zoomAt(1.3, viewW / 2, viewH / 2),
    zoomOut: () => zoomAt(1 / 1.3, viewW / 2, viewH / 2),
    fit
  };
}

/* ============ 全屏横向展卷（原生横向滚动 + GSAP ScrollTrigger scrub 视差） ============ */
(function () {
  const viewport = document.getElementById('scrollViewport');
  const track = document.getElementById('scrollTrack');
  const trackInner = document.getElementById('scrollTrackInner');
  const wrapper = document.getElementById('painting');
  const img = document.getElementById('paintingImg');
  const waves = viewport ? viewport.querySelector('.scroll-waves') : null;
  if (!viewport || !track || !trackInner || !wrapper) return;

  let centerMode = false;
  function maxScroll() {
    return Math.max(0, wrapper.offsetWidth - viewport.clientWidth);
  }
  function updateBounds() {
    const ms = maxScroll();
    if (centerMode) {
      if (ms <= 0) {
        // 整幅不超宽：画卷水平居中显示（不滚动），彻底解决宫乐图贴左
        trackInner.style.justifyContent = 'center';
        track.scrollLeft = 0;
      } else {
        // 超宽：画卷横向居中（滚到正中），可再左右平移
        trackInner.style.justifyContent = 'flex-start';
        track.scrollLeft = ms / 2;
      }
    } else {
      trackInner.style.justifyContent = 'flex-start';
    }
    if (window.ScrollTrigger) ScrollTrigger.refresh();
  }
  if (img) img.addEventListener('load', updateBounds);
  updateBounds();
  window.addEventListener('resize', updateBounds);

  function centerScroll() {
    if (!centerMode) return;
    auto = false;
    updateBounds();
  }
  window.__setCenterMode = function (v) {
    centerMode = !!v;
    if (centerMode) centerScroll();
  };
  window.__centerScroll = centerScroll;

  /* 空闲自动缓慢滚动：静止 3.5s 后自动往返横移，交互时暂停，空闲后恢复（居中模式跳过） */
  let auto = true, autoDir = 1, lastActive = -1e9;
  const AUTO_SPEED = 0.35; // px / 帧 ≈ 21px/s
  function userActive() { auto = false; lastActive = performance.now(); }

  viewport.addEventListener('wheel', (e) => {
    e.preventDefault();
    userActive();
    track.scrollLeft += e.deltaY * 1.2;
  }, { passive: false });

  let isDown = false, startClientX = 0, startScrollX = 0;
  viewport.addEventListener('pointerdown', (e) => {
    if (e.target.closest('.hotspot')) return;
    userActive();
    isDown = true;
    startClientX = e.clientX;
    startScrollX = track.scrollLeft;
    viewport.style.cursor = 'grabbing';
  });
  window.addEventListener('pointermove', (e) => {
    if (!isDown) return;
    const dx = e.clientX - startClientX;
    track.scrollLeft = startScrollX - (dx * 1.5);
  });
  window.addEventListener('pointerup', () => { isDown = false; viewport.style.cursor = 'grab'; });
  window.addEventListener('pointercancel', () => { isDown = false; viewport.style.cursor = 'grab'; });

  (function animate(now) {
    const ms = maxScroll();
    if (!centerMode && auto && ms > 0) {
      track.scrollLeft += autoDir * AUTO_SPEED;
      if (track.scrollLeft >= ms) { track.scrollLeft = ms; autoDir = -1; }
      else if (track.scrollLeft <= 0) { track.scrollLeft = 0; autoDir = 1; }
    } else if (!centerMode && !auto && (now - lastActive) > 2500 && ms > 0) {
      auto = true;
    }
    requestAnimationFrame(animate);
  })(performance.now());

  /* ---- GSAP ScrollTrigger scrub 视差：背景层 0.4x、前景层（画卷+热点）1.2x、滚动淡入 ---- */
  let stReady = false;
  function applyParallax() {
    const ms = Math.max(1, maxScroll());
    const p = Math.max(0, Math.min(1, track.scrollLeft / ms));
    const fade = 0.8 + 0.2 * Math.min(1, p / 0.2); // 滚动前 20% 完成微淡入（画卷保持明亮）
    if (waves) gsap.set(waves, { x: -track.scrollLeft * 0.4 });
    // trackInner 额外 -0.2x → 画卷/热点总位移 = 原生滚动 1.0x + 0.2x = 1.2x
    gsap.set(trackInner, { x: -track.scrollLeft * 0.2, opacity: fade });
  }
  function initScrollTrigger() {
    if (stReady) return;
    stReady = true;
    if (typeof gsap === 'undefined' || typeof ScrollTrigger === 'undefined') return;
    gsap.registerPlugin(ScrollTrigger);
    ScrollTrigger.create({
      trigger: trackInner,
      scroller: track,
      horizontal: true,
      start: 0,
      end: () => Math.max(1, maxScroll()),
      scrub: true,
      onUpdate: applyParallax
    });
    applyParallax();
  }
  initScrollTrigger();

  window.__resetScroll = () => {
    if (centerMode) { updateBounds(); track.scrollLeft = Math.max(0, Math.min(maxScroll(), maxScroll() / 2)); }
    else { track.scrollLeft = 0; autoDir = 1; }
  };
  window.__recalcScroll = updateBounds;
})();

/* ============ 详情渲染：DepthCarousel 纵深轮播 ============ */
/* 单张乐器卡 HTML（不含返回/退出，放轮播外层） */
function buildCardHTML(it) {
  const isGongle = sceneKey === 'gongle';
  const t = I18N[lang];
  const rowsHtml = it.rows.map((r, i) =>
    '<div class="info-row" style="transition-delay:' + (0.30 + i * 0.06) + 's"><span class="label">' + r[0] + '</span><span class="value">' + r[1] + '</span></div>'
  ).join("");
  return '<article class="instrument-card">'
    + '<div class="detail-tools">'
    + '<button type="button" class="btn btn--sm btn--outline dz-out" aria-label="' + t.zoomOut + '">' + t.zoomOut + '</button>'
    + '<button type="button" class="btn btn--sm btn--primary dz-fit">' + t.zoomFit + '</button>'
    + '<button type="button" class="btn btn--sm btn--outline dz-in" aria-label="' + t.zoomIn + '">' + t.zoomIn + '</button>'
    + '<button type="button" class="detail-close" id="detailClose" aria-label="' + t.exit + '" title="' + t.exit + '">'
    + '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round"><path d="M6 6l12 12M18 6L6 18"/></svg>' + t.exit + '</button>'
    + '</div>'
    + '<div class="detail-zoom"><div class="detail-canvas">'
    + '<div class="detail-content" data-lqip="' + it.id + '">' + (isGongle
        ? '<div class="attached-card"><img src="assets/' + it.id + '.webp" alt="' + it.full + '" decoding="async" draggable="false"></div>'
        : '<img src="assets/' + it.id + '.webp" alt="' + it.full + '" decoding="async" draggable="false">') + '</div>'
    + '</div><span class="detail-zoom-hint">' + t.zoomHint + '</span></div>'
    + '<div class="card-head"><h2>' + it.full + '</h2><span class="instrument-tag">' + it.tag + '</span></div>'
    + '<p class="instrument-desc">' + it.desc + '</p>'
    + rowsHtml
    + '</article>';
}

/* 乐器详情：单卡 + 淡入淡出（最初形式，无纵深轮播）
   dir = ±1 时表示乐器间左右切换，入场交给 swapTo 统一处理 */
function renderDetail(id, dir) {
  const it = byId[id];
  if (!it) { window.location.hash = '#/'; return; }
  const wrap = document.getElementById('detailWrap');
  const swap = dir === 1 || dir === -1;
  const t = I18N[lang];
  const L = instruments.length;
  const prevIt = instruments[(it.index - 1 + L) % L];
  const nextIt = instruments[(it.index + 1) % L];
  const topbar =
    '<div class="detail-topbar">'
    + '<a class="back-link specular" href="#/" aria-label="' + t.back + '">'
    + '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M15 5l-7 7 7 7"/></svg>' + t.back + '</a>'
    + '</div>';
  const nav =
    '<nav class="detail-nav">'
    + '<a class="prev" href="#/instrument/' + prevIt.id + '">'
    + '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M15 5l-7 7 7 7"/></svg><span>' + prevIt.full + '</span></a>'
    + '<a class="next" href="#/instrument/' + nextIt.id + '">'
    + '<span>' + nextIt.full + '</span><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M9 5l7 7-7 7"/></svg></a>'
    + '</nav>';
  wrap.innerHTML = topbar + '<div class="detail-single">' + buildCardHTML(it) + nav + '</div>';
  // 退出用场景转场（墨迹），不再硬切
  // 缩放绑定
  const card = wrap.querySelector('.instrument-card');
  const dz = card.querySelector('.detail-zoom');
  const content = card.querySelector('.detail-content');
  try {
    const ctrl = zoomable(dz, content, true, 0.5);
    const zin = card.querySelector('.dz-in'), zout = card.querySelector('.dz-out'), zfit = card.querySelector('.dz-fit');
    if (zin) zin.addEventListener('click', ctrl.zoomIn);
    if (zout) zout.addEventListener('click', ctrl.zoomOut);
    if (zfit) zfit.addEventListener('click', ctrl.fit);
  } catch (e) {}
  // 乐器大图：LQIP 占位 + 解码淡入，就绪后重算缩放基准
  const dContent = card.querySelector('.detail-content');
  const dImg = card.querySelector('.detail-content img');
  if (dContent && dImg) __loadImg(dImg, dContent, it.id);
  const navEl = wrap.querySelector('.detail-nav');
  if (swap) {
    // 乐器左右切换：卡片入场由 swapTo 控制，导航条只做极轻的淡入
    if (navEl) gsap.fromTo(navEl, { autoAlpha: 0 }, { autoAlpha: 1, duration: 0.3, delay: 0.06 });
  } else {
    // 首次进入（从画卷点朱砂）：自下方轻推 + 去虚化淡入
    gsap.fromTo(card, { autoAlpha: 0, y: 18, filter: 'blur(8px)' }, { autoAlpha: 1, y: 0, filter: 'blur(0px)', duration: 0.55, ease: 'power2.out', onComplete: () => gsap.set(card, { clearProps: 'filter' }) });
    if (navEl) gsap.fromTo(navEl, { autoAlpha: 0, y: 8 }, { autoAlpha: 1, y: 0, duration: 0.45, delay: 0.16, clearProps: 'transform' });
  }
}

/* 乐器间左右切换：旧卡滑出 → 原地换内容 → 新卡自反向滑入（背景与顶栏保持不动） */
function swapTo(id, dir) {
  if (!byId[id]) return;
  const wrap = document.getElementById('detailWrap');
  const card = wrap && wrap.querySelector('.instrument-card');
  if (!card || typeof gsap === 'undefined') { location.hash = '#/instrument/' + id; return; }
  if (wrap.dataset.swapping === '1') return;
  wrap.dataset.swapping = '1';
  gsap.killTweensOf(card);
  gsap.to(card, {
    autoAlpha: 0, x: dir * 44, scale: 0.985,
    duration: 0.2, ease: 'power2.in',
    onComplete: () => {
      history.replaceState(null, '', '#/instrument/' + id);
      renderDetail(id, dir);
      const nc = wrap.querySelector('.instrument-card');
      if (nc) {
        gsap.fromTo(nc,
          { autoAlpha: 0, x: -dir * 44, scale: 0.99 },
          { autoAlpha: 1, x: 0, scale: 1, duration: 0.4, ease: 'power3.out', clearProps: 'transform' });
      }
      wrap.dataset.swapping = '0';
    }
  });
}

/* ============ 场景转场：墨迹自点击处扩散（画卷 ↔ 乐器详情） ============ */
let __veilBusy = false;
function inkWipe(x, y, action) {
  if (prefersReduced() || typeof gsap === 'undefined' || __veilBusy) { action(); return; }
  __veilBusy = true;
  let veil = document.getElementById('navVeil');
  if (!veil) {
    veil = document.createElement('div');
    veil.id = 'navVeil';
    veil.className = 'nav-veil';
    const ink0 = document.createElement('div');
    ink0.className = 'nav-veil__ink';
    veil.appendChild(ink0);
    document.body.appendChild(veil);
  }
  const ink = veil.firstChild;
  const px = (x === undefined || x === null) ? window.innerWidth / 2 : x;
  const py = (y === undefined || y === null) ? window.innerHeight / 2 : y;
  ink.style.left = px + 'px';
  ink.style.top = py + 'px';
  veil.style.visibility = 'visible';
  gsap.killTweensOf([veil, ink]);
  gsap.set(veil, { opacity: 1 });
  gsap.fromTo(ink, { scale: 0 }, {
    scale: 2.2, duration: 0.36, ease: 'power2.in',
    onComplete: () => {
      try { action(); } catch (e) {}
      gsap.to(ink, { scale: 2.5, duration: 0.5, ease: 'power1.out' });
      gsap.to(veil, {
        opacity: 0, duration: 0.48, delay: 0.05, ease: 'power2.out',
        onComplete: () => { veil.style.visibility = 'hidden'; __veilBusy = false; }
      });
    }
  });
}

/* ============ 路由 ============ */
function route() {
  const hash = location.hash || "#/";
  const m = hash.match(/^#\/instrument\/(\w+)/);
  const showScroll = document.getElementById("view-scroll");
  const showDetail = document.getElementById("view-detail");
  if (m) {
    renderDetail(m[1]);
    showDetail.classList.add("active");
    showScroll.classList.remove("active");
    // 直接进入乐器详情时，开场入场界面（文件夹/票根）与开始界面（intro）不应再遮挡，移除
    const welcomeEl = document.getElementById('welcome');
    if (welcomeEl) welcomeEl.remove();
    const introEl = document.getElementById('intro');
    if (introEl) { introEl.classList.add('hidden'); introEl.remove(); }
    document.body.classList.remove("page-leaving");
    // 详情视图：恢复原生滚动以阅读正文
    document.documentElement.style.overflow = 'auto';
    document.body.style.overflow = 'auto';
    window.scrollTo(0, 0);
    // 乐器切换由 DepthCarousel 纵深轮播接管（无卡顿转场）
  } else {
    showScroll.classList.add("active");
    showDetail.classList.remove("active");
    document.body.classList.remove("page-leaving");
    // 画卷视图：锁定原生滚动，保持全屏横向展卷
    document.documentElement.style.overflow = 'hidden';
    document.body.style.overflow = 'hidden';
    if (window.__recalcScroll) window.__recalcScroll();
    if (window.__centerScroll) window.__centerScroll(); // 宫乐图居中
    const scT = cur();
    document.title = (lang === 'en' && scT.en) ? scT.en.title : scT.title;
  }
}
window.addEventListener("hashchange", route);

/* 点击：返回画卷 / 乐器左右切换 / 热点进详情，统一走转场 */
document.addEventListener("click", (e) => {
  // 返回画卷：墨迹从按钮处收拢
  const back = e.target.closest(".back-link, #detailClose");
  if (back) {
    e.preventDefault();
    if (location.hash === "#/" || location.hash === "") return;
    const r = back.getBoundingClientRect();
    inkWipe(r.left + r.width / 2, r.top + r.height / 2, () => { location.hash = "#/"; });
    return;
  }

  // 上一件 / 下一件：原地滑切，不重新进入整个详情视图
  const navA = e.target.closest(".detail-nav a");
  if (navA) {
    e.preventDefault();
    const mm = (navA.getAttribute("href") || "").match(/#\/instrument\/(\w+)/);
    if (!mm) return;
    swapTo(mm[1], navA.classList.contains("next") ? 1 : -1);
    return;
  }

  const a = e.target.closest(".hotspot");
  if (!a) return;
  if (a.classList.contains("emperor-hotspot")) {
    e.preventDefault();
    document.querySelectorAll(".emperor-hotspot.open").forEach(o => { if (o !== a) o.classList.remove("open"); });
    a.classList.toggle("open");
    return;
  }
  const url = a.getAttribute("href");
  if (!url || url === "#") return;
  e.preventDefault();
  // 朱砂墨点处晕开：墨迹扩散盖住切换，再自中心化开显露详情
  inkWipe(e.clientX, e.clientY, () => { location.hash = url; });
});

/* ============ 开场帷幕 ============ */
/* 帷幕改由加载界面结束时触发（见文件底部），不再死等 window.load，避免慢网下长时间黑屏 */

route();

/* ============ 文件夹：Folder 组件弹簧物理（flap · solid） ============
   相位 rest / peek / open；翻盖角度、指针 3D 倾斜、悬停抬升、按压回弹、
   打开后下沉淡出、入场「先开后合」，全部跑在同一个 rAF 半隐式欧拉积分器上。
   bounce = 0.4 → zeta = 0.712（欠阻尼，落位带一次轻微回弹）。
   仅改运动，不改颜色 / 文字 / 图片。 */
(function folderEngine() {
  const root = document.getElementById('folderRoot');
  if (!root) return;
  const stage = root.querySelector('.folder-stage');
  const front = document.getElementById('folderFront');
  const cast = root.querySelector('.folder-cast');
  if (!stage || !front) return;

  const reduce = window.matchMedia('(prefers-reduced-motion: reduce)').matches;
  const TAU = Math.PI * 2, STEP = 1 / 240;
  const clamp = (v, lo, hi) => Math.min(hi, Math.max(lo, v));
  const spring = v => ({ value: v, velocity: 0 });
  const ANGLE = { rest: 0, peek: -15, open: -64, intro: -42 };
  const BOUNCE = 0.4, TILT = 0.5;
  /* 对齐 Folder 的 intro 时序：closeAt = (0.16 + count*0.085 + 0.3) / speed */
  const INTRO_SPEED = 1, TT_COUNT = 2;
  const CLOSE_AT = (0.16 + TT_COUNT * 0.085 + 0.3) / INTRO_SPEED;
  const APPEAR_AT = 0.34 / INTRO_SPEED;

  const S = {
    raf: 0, last: 0, hovered: false, pressed: false, opened: false,
    px: 0, py: 0,
    intro: { phase: 'wait', start: 0 },   // wait → run → done（Folder intro 相位机）
    appear: reduce ? 1 : 0,
    front: spring(reduce ? ANGLE.rest : ANGLE.intro),
    rx: spring(0), ry: spring(0), lift: spring(0),
    squash: spring(1), anchor: spring(0)
  };

  /* 240Hz 子步积分：高帧率与大 dt 下都稳定，不会像 CSS 缓动那样跳帧 */
  function integrate(item, target, omega, zeta, dt) {
    const k = omega * omega, d = 2 * zeta * omega;
    const steps = Math.max(1, Math.ceil(dt / STEP)), step = dt / steps;
    for (let i = 0; i < steps; i++) {
      item.velocity += (k * (target - item.value) - d * item.velocity) * step;
      item.value += item.velocity * step;
    }
    return Math.abs(target - item.value) > 0.01 || Math.abs(item.velocity) > 0.01;
  }
  function snap(item, v) { item.value = v; item.velocity = 0; }
  function phase() {
    if (S.opened) return 'open';
    if (S.hovered && !reduce) return 'peek';
    return 'rest';
  }

  function write() {
    const zoom = (1 + S.lift.value * 0.012) * S.squash.value * (0.94 + 0.06 * clamp(S.appear, 0, 1));
    /* perspective() 写在 transform 里只作用于 stage 自身姿态；CSS perspective 属性仍作用于子层前盖 */
    stage.style.transform = 'perspective(1400px) rotateX(' + S.rx.value.toFixed(3) + 'deg) rotateY('
      + S.ry.value.toFixed(3) + 'deg) scale(' + zoom.toFixed(4) + ')';
    front.style.transform = 'rotateX(' + S.front.value.toFixed(3) + 'deg)';

    /* 翻盖法向决定迎光量：掀开时逐渐转暗，越过水平面时给一点高光 */
    const a = S.front.value * Math.PI / 180;
    const facing = Math.sin(a) * 0.5 + Math.cos(a) * 0.86;
    const light = facing / 0.86;
    front.style.setProperty('--folder-glint', clamp((light - 1) * 0.9, 0, 0.16).toFixed(3));
    front.style.setProperty('--folder-dim', clamp((1 - light) * 0.22, 0, 0.45).toFixed(3));

    /* 打开后文件夹整体下沉淡出（原 CSS 的 .35 / 26px / .92 改由弹簧连续驱动） */
    const anchor = clamp(S.anchor.value, 0, 1);
    root.style.opacity = ((1 - 0.65 * anchor) * clamp(S.appear, 0, 1)).toFixed(3);
    root.style.transform = 'translateY(' + (26 * anchor).toFixed(2) + 'px) scale('
      + (1 - 0.08 * anchor).toFixed(4) + ')';
    if (cast) {
      cast.style.opacity = (0.75 + S.lift.value * 0.25).toFixed(3);
      cast.style.transform = 'translateY(' + (-S.lift.value * 2).toFixed(2) + 'px) scale('
        + (1 + S.lift.value * 0.06).toFixed(3) + ')';
    }
  }

  function frame(now) {
    S.raf = 0;
    const dt = S.last ? Math.min(0.05, (now - S.last) / 1000) : 1 / 60;
    S.last = now;

    /* intro 相位：wait（帷幕未落幕）→ run（staged 掀盖 + 淡入）→ done */
    const I = S.intro;
    if (I.phase === 'wait' && !reduce) {
      if (document.getElementById('loader')) {
        write();
        S.raf = requestAnimationFrame(frame);
        return;
      }
      I.phase = 'run';
      I.start = now / 1000;
    } else if (I.phase !== 'run') {
      S.appear = 1;
    }

    const zeta = reduce ? 1 : 1 - 0.72 * BOUNCE;
    const frontOmega = TAU * 2, softOmega = TAU * 1.6;
    let busy = false;
    let target = ANGLE[phase()];

    if (I.phase === 'run') {
      const t = now / 1000 - I.start;
      /* 与 Folder 的 holding 一致：错峰落位期间保持掀盖，之后合盖 */
      if (t < CLOSE_AT) target = ANGLE.intro;
      S.appear = 1 - Math.pow(1 - clamp(t / APPEAR_AT, 0, 1), 3);
      if (t > CLOSE_AT + 0.7 / INTRO_SPEED) I.phase = 'done';
      busy = true;
    }

    busy = integrate(S.front, target, frontOmega, zeta, dt) || busy;
    /* 翻盖撞到闭合面时按 Folder 的 restitution 回弹，避免弹簧过冲成反向翻折 */
    if (!S.opened && S.front.value > 0) {
      S.front.value = -S.front.value;
      S.front.velocity = -S.front.velocity * (0.2 + 0.35 * BOUNCE);
    }
    busy = integrate(S.anchor, S.opened ? 1 : 0, frontOmega, 1, dt) || busy;

    const engaged = S.hovered && !S.opened && !reduce;
    busy = integrate(S.rx, engaged ? -S.py * 8 * TILT : 0, softOmega, 1, dt) || busy;
    busy = integrate(S.ry, engaged ? S.px * 10 * TILT : 0, softOmega, 1, dt) || busy;
    busy = integrate(S.lift, engaged ? 1 : 0, softOmega, 1, dt) || busy;
    busy = integrate(S.squash, S.pressed ? 0.975 : 1, TAU * 3.2, 0.6, dt) || busy;

    write();
    if (busy) S.raf = requestAnimationFrame(frame);
    else S.last = 0;
  }
  function wake() { if (!S.raf) S.raf = requestAnimationFrame(frame); }

  function open() {
    if (S.opened) return;
    S.opened = true;
    S.hovered = false;
    S.intro.phase = 'done';
    S.appear = 1;
    root.setAttribute('data-open', '');
    stage.setAttribute('aria-expanded', 'true');
    wake();
    /* 翻盖掀到一半时，两张票根从袋中错峰抽出 */
    setTimeout(function () {
      const pop = document.getElementById('ttPop');
      if (pop) pop.classList.add('show');
      window.dispatchEvent(new Event('folder:open'));
    }, 300);
  }

  stage.addEventListener('pointermove', function (e) {
    if (e.pointerType === 'touch' || S.opened) return;
    const r = root.getBoundingClientRect();
    if (!r.width) return;
    S.px = clamp((e.clientX - (r.left + r.width / 2)) / (r.width / 2), -1, 1);
    S.py = clamp((e.clientY - (r.top + r.height / 2)) / (r.height / 2), -1, 1);
    if (!S.hovered) { S.hovered = true; S.intro.phase = 'done'; S.appear = 1; }
    wake();
  }, { passive: true });
  stage.addEventListener('pointerleave', function () {
    if (S.opened) return;
    S.hovered = false; S.px = 0; S.py = 0;
    wake();
  });
  stage.addEventListener('pointerdown', function () { S.pressed = true; S.intro.phase = 'done'; S.appear = 1; wake(); });
  window.addEventListener('pointerup', function () {
    if (S.pressed) { S.pressed = false; wake(); }
  });
  stage.addEventListener('click', open);
  stage.addEventListener('keydown', function (e) {
    if (e.key === 'Enter' || e.key === ' ') { e.preventDefault(); open(); }
  });

  write();
  wake();
})();

/* ============ 文件夹 + 双票根（合乐图 / 宫乐图）撕票交互 ============
   撕裂物理：拉伸出纤维 → 逐根崩断并回缩 → 三点悬挂 → 抛落淡出
   另加：纯点击自动撕下、指针 3D 倾斜与图面视差。整套状态跑在 rAF 上，不再依赖 CSS 过渡 */
(function () {
  const folder = document.getElementById('folderRoot');
  const ttPop = document.getElementById('ttPop');
  if (!folder || !ttPop) return;
  const reduceMotion = window.matchMedia('(prefers-reduced-motion: reduce)').matches;

  const clamp = (v, lo, hi) => Math.min(hi, Math.max(lo, v));
  const rad = d => d * Math.PI / 180;
  const wrap = a => Math.atan2(Math.sin(a), Math.cos(a));
  const noise = seed => { let s = seed | 0; return () => {
    s = (s + 0x6d2b79f5) | 0; let t = Math.imul(s ^ (s >>> 15), 1 | s);
    t = (t + Math.imul(t ^ (t >>> 7), 61 | t)) ^ t;
    return ((t ^ (t >>> 14)) >>> 0) / 4294967296; }; };
  const ff = n => (n === undefined || n === null ? 0 : n).toFixed(2);

  const W = 460, H = 250, S = 150, R = 16, HOLES = 12, HOLE = 6, NOTCH = 3, ROUGH = 0;
  const TEAR_ANGLE = 30, STRETCH = 28, RESISTANCE = 0.4;
  const RETRACT = 0.17;        // 断口纤维回缩时长（秒）
  const GRAVITY = 2400;        // 抛落重力
  const TILT_MAX = 7, TILT_REACH = 320, PARALLAX = 6, PERSPECTIVE = 1000, ROTATE = 4;

  function buildGeometry() {
    const x = W - S, hr = HOLE / 2, n = Math.max(1, Math.round(HOLES));
    const span = H - 2 * NOTCH, bridge = Math.max(2, (span - n * HOLE) / (n + 1));
    const random = noise(n * 7919 + Math.round(H));
    const pt = (u, v) => ff(u) + ',' + ff(v);
    const arc = (r, sw, u, v) => 'A' + ff(r) + ',' + ff(r) + ' 0 0 ' + sw + ' ' + pt(u, v);
    const bridges = [];
    for (let i = 0; i <= n; i++) {
      const y0 = NOTCH + i * (bridge + HOLE), y1 = y0 + bridge;
      const steps = Math.max(2, Math.round(bridge / 2.2)); const pts = [];
      for (let k = 1; k < steps; k++) pts.push([x + (random() - 0.5) * 2 * ROUGH, y0 + bridge * k / steps]);
      bridges.push({ y0: y0, y1: y1, mid: (y0 + y1) / 2, y: (y0 + y1) / 2, pts: pts, x: x });
    }
    let body = 'M' + pt(R, 0) + 'L' + pt(x - NOTCH, 0) + arc(NOTCH, 0, x, NOTCH);
    bridges.forEach((b, i) => {
      b.pts.forEach(p => body += 'L' + pt(p[0], p[1]));
      body += 'L' + pt(x, b.y1); if (i < n) body += arc(hr, 0, x, b.y1 + HOLE);
    });
    body += arc(NOTCH, 0, x - NOTCH, H) + 'L' + pt(R, H) + arc(R, 1, 0, H - R) + 'L' + pt(0, R) + arc(R, 1, R, 0) + 'Z';
    let stub = 'M' + pt(x + NOTCH, 0) + 'L' + pt(W - R, 0) + arc(R, 1, W, R) + 'L' + pt(W, H - R) + arc(R, 1, W - R, H) + 'L' + pt(x + NOTCH, H) + arc(NOTCH, 0, x, H - NOTCH);
    for (let i = n; i >= 0; i--) {
      const b = bridges[i];
      for (let k = b.pts.length - 1; k >= 0; k--) stub += 'L' + pt(b.pts[k][0], b.pts[k][1]);
      stub += 'L' + pt(x, b.y0); if (i > 0) stub += arc(hr, 0, x, b.y0 - HOLE);
    }
    stub += arc(NOTCH, 0, x + NOTCH, 0) + 'Z';
    const bodyOutline = 'M' + pt(x, H - NOTCH) + arc(NOTCH, 0, x - NOTCH, H) + 'L' + pt(R, H) + arc(R, 1, 0, H - R) + 'L' + pt(0, R) + arc(R, 1, R, 0) + 'L' + pt(x - NOTCH, 0) + arc(NOTCH, 0, x, NOTCH);
    const stubOutline = 'M' + pt(x, NOTCH) + arc(NOTCH, 0, x + NOTCH, 0) + 'L' + pt(W - R, 0) + arc(R, 1, W, R) + 'L' + pt(W, H - R) + arc(R, 1, W - R, H) + 'L' + pt(x + NOTCH, H) + arc(NOTCH, 0, x, H - NOTCH);
    return { body: body, stub: stub, bridges: bridges, bodyOutline: bodyOutline, stubOutline: stubOutline, cross: H };
  }

  /* 每张票根自成一体：独立 geo / 物理状态 / 撕裂交互，撕开即进入对应场景 */
  function buildTicket(scene) {
    const geo = buildGeometry();
    const n = geo.bridges.length;
    function el(tag, cls) { const e = document.createElement(tag); if (cls) e.className = cls; return e; }
    const root = el('div', 'tt'), stage = el('div', 'tt__stage'), plane = el('div', 'tt__plane');
    const bodyPiece = el('div', 'tt__piece');
    const bodyEdge = el('svg', 'tt__edge'); bodyEdge.setAttribute('viewBox', '0 0 ' + W + ' ' + H);
    const bodyEdgePath = document.createElementNS('http://www.w3.org/2000/svg', 'path');
    bodyEdgePath.setAttribute('d', geo.bodyOutline); bodyEdge.appendChild(bodyEdgePath);
    const bodyPaper = el('div', 'tt__paper'); bodyPaper.style.clipPath = "path('" + geo.body + "')";
    const art = el('div', 'tt__art');
    const image = el('img', 'tt__image'); image.src = scene.img; image.alt = scene.ticketAlt; image.draggable = false;
    const scrim = el('div', 'tt__scrim');
    art.appendChild(image); art.appendChild(scrim);
    const content = el('div', 'tt__content');
    const tname = el('span', 'tt__name'); tname.textContent = '中国古画中的民乐';
    content.appendChild(tname);
    bodyPaper.appendChild(art); bodyPaper.appendChild(content);
    bodyPiece.appendChild(bodyEdge); bodyPiece.appendChild(bodyPaper);
    const fibresSvg = el('svg', 'tt__fibres');
    const fibres = [];
    geo.bridges.forEach(() => {
      const a = document.createElementNS('http://www.w3.org/2000/svg', 'path');
      const b = document.createElementNS('http://www.w3.org/2000/svg', 'path');
      fibresSvg.appendChild(a); fibresSvg.appendChild(b); fibres.push(a, b);
    });
    const stubPiece = el('div', 'tt__piece tt__piece--stub');
    stubPiece.setAttribute('role', 'button'); stubPiece.setAttribute('tabindex', '0');
    stubPiece.setAttribute('aria-label', '撕下票根：' + scene.ticketName);
    const stubEdge = el('svg', 'tt__edge'); stubEdge.setAttribute('viewBox', '0 0 ' + W + ' ' + H);
    const stubEdgePath = document.createElementNS('http://www.w3.org/2000/svg', 'path');
    stubEdgePath.setAttribute('d', geo.stubOutline); stubEdge.appendChild(stubEdgePath);
    const stubPaper = el('div', 'tt__paper tt__paper--stub'); stubPaper.style.clipPath = "path('" + geo.stub + "')";
    const stubBox = el('div', 'tt__stub');
    const sh3 = el('h3'); sh3.textContent = scene.ticketName;
    const sp = el('p'); sp.textContent = scene.ticketSub;
    const ss = el('span'); ss.textContent = scene.ticketNo;
    stubBox.appendChild(sh3); stubBox.appendChild(sp); stubBox.appendChild(ss);
    stubPaper.appendChild(stubBox);
    stubPiece.appendChild(stubEdge); stubPiece.appendChild(stubPaper);
    plane.appendChild(bodyPiece); plane.appendChild(fibresSvg); plane.appendChild(stubPiece);
    stage.appendChild(plane); root.appendChild(stage);

    const limit = rad(TEAR_ANGLE);
    const s = {
      raf: 0, last: 0, phase: 'idle', id: null,
      sign: 1, hinge: { x: 0, y: 0 }, hingeV: 0,
      grab: { x: 0, y: 0 }, start: { x: 0, y: 0 }, point: { x: 0, y: 0 },
      a0: 0, theta: 0,
      sx: 0, sy: 0, vx: 0, vy: 0, spin: 0,
      pvx: 0, pvy: 0, pt: 0,
      fade: 1, age: 0, bx: 0, bv: 0,
      snapped: [], snapAt: [], span: [],
      auto: 0, autoT0: 0, autoX: 0
    };
    for (let i = 0; i < n; i++) { s.snapped.push(false); s.snapAt.push(0); s.span.push(0); }
    let torn = false, done = false;

    /* ---------- 绘制：票根位移、纸面震颤、断口纤维 ---------- */
    function paint(now) {
      stubPiece.style.transform = 'translate(' + s.sx.toFixed(2) + 'px,' + s.sy.toFixed(2) + 'px) rotate('
        + (s.theta * s.sign * 180 / Math.PI).toFixed(3) + 'deg)';
      stubPiece.style.opacity = s.fade.toFixed(3);
      bodyPiece.style.transform = 'translateX(' + s.bx.toFixed(2) + 'px)';

      const cos = Math.cos(s.theta * s.sign), sin = Math.sin(s.theta * s.sign);
      let busy = false;
      geo.bridges.forEach((b, i) => {
        const near = fibres[i * 2], far = fibres[i * 2 + 1];
        if (!near || !far) return;
        const dx = b.x - s.hinge.x, dy = b.y - s.hinge.y;
        const tx = s.hinge.x + dx * cos - dy * sin + s.sx;
        const ty = s.hinge.y + dx * sin + dy * cos + s.sy;
        const ox = b.x + s.bx, oy = b.y;
        const gx = tx - ox, gy = ty - oy;
        const gap = Math.hypot(gx, gy);

        if (!s.snapped[i]) {
          const live = s.phase !== 'idle' && !reduceMotion;
          if (!live || gap < 0.35) { near.style.opacity = '0'; far.style.opacity = '0'; return; }
          const k = clamp(gap / STRETCH, 0, 1);
          const sag = gap * 0.18;
          const w = (1.7 - 1.15 * k).toFixed(2);
          const mx = ox + gx / 2, my = oy + gy / 2 + sag;
          near.setAttribute('d', 'M' + ff(ox) + ',' + ff(oy - 1.6) + 'Q' + ff(mx) + ',' + ff(my - 1.6) + ' ' + ff(tx) + ',' + ff(ty - 1.6));
          far.setAttribute('d', 'M' + ff(ox) + ',' + ff(oy + 1.6) + 'Q' + ff(mx) + ',' + ff(my + 1.6) + ' ' + ff(tx) + ',' + ff(ty + 1.6));
          near.style.strokeWidth = w; far.style.strokeWidth = w;
          near.style.opacity = '1'; far.style.opacity = '1';
          s.span[i] = gap;
          return;
        }

        /* 已崩断：纤维从两端回缩消失 */
        const t = (now - s.snapAt[i]) / 1000 / RETRACT;
        if (!s.snapAt[i] || t >= 1) { near.style.opacity = '0'; far.style.opacity = '0'; return; }
        busy = true;
        const left = (1 - t) * (1 - t);
        const len = (s.span[i] || STRETCH) * 0.5 * left;
        const ux = gap > 0.01 ? gx / gap : 1, uy = gap > 0.01 ? gy / gap : 0;
        near.setAttribute('d', 'M' + ff(ox) + ',' + ff(oy) + 'L' + ff(ox + ux * len) + ',' + ff(oy + uy * len));
        far.setAttribute('d', 'M' + ff(tx) + ',' + ff(ty) + 'L' + ff(tx - ux * len) + ',' + ff(ty - uy * len));
        near.style.strokeWidth = '0.9'; far.style.strokeWidth = '0.9';
        near.style.opacity = left.toFixed(2); far.style.opacity = left.toFixed(2);
      });
      return busy;
    }

    /* ---------- 物理积分 ---------- */
    function step(now) {
      const dt = clamp((now - s.last) / 1000, 0.001, 0.034);
      s.last = now;

      if (s.phase === 'held') {
        if (s.auto) {
          const t = clamp((now - s.autoT0) / 520, 0, 1);
          const e = 1 - Math.pow(1 - t, 3);
          s.point.x = s.start.x + s.autoX * e;
          s.point.y = s.start.y + 22 * e * e;
        }
        let intact = 0;
        for (let i = 0; i < n; i++) if (!s.snapped[i]) intact++;
        const hold = n ? intact / n : 0;
        const follow = 0.92 * (1 - clamp(RESISTANCE, 0, 0.95) * hold);
        const a = Math.atan2(s.point.y - s.hinge.y, s.point.x - s.hinge.x);
        const want = clamp(wrap(a - s.a0) * s.sign * follow, 0, limit + 0.1);
        s.theta += (want - s.theta) * (1 - Math.exp(-dt / 0.035));
        const away = clamp((s.point.x - s.start.x) * 0.05, -2, 4);
        const side = clamp((s.point.y - s.start.y) * 0.05, -3, 3);
        s.sx += (away - s.sx) * (1 - Math.exp(-dt / 0.05));
        s.sy += (side - s.sy) * (1 - Math.exp(-dt / 0.05));

        const slack = Math.hypot(s.sx, s.sy);
        let left = 0;
        geo.bridges.forEach((b, i) => {
          if (s.snapped[i]) return;
          const d = Math.abs(b.mid - s.hingeV);
          if (2 * d * Math.sin(s.theta / 2) + slack > STRETCH || s.theta >= limit) {
            s.snapped[i] = true; s.snapAt[i] = now; s.span[i] = Math.max(slack, 2 * d * Math.sin(s.theta / 2));
            s.bv -= 560 / n;                      // 每断一根，纸面回弹一下
          } else left++;
        });
        if (s.auto && now - s.autoT0 > 1000) {     // 兜底：自动撕票最多 1s
          geo.bridges.forEach((b, i) => { if (!s.snapped[i]) { s.snapped[i] = true; s.snapAt[i] = now; left--; } });
          left = 0;
        }
        if (left === 0) {
          s.phase = 'free';
          s.bv -= 150;
          if (s.auto) {                            // 点击撕票：断开即抛飞，不必等松手
            s.phase = 'drop';
            s.vx = 860; s.vy = -190; s.spin = 2.6 * s.sign;
            s.age = 0; s.fade = 1;
          }
        }
      } else if (s.phase === 'free') {
        const cos = Math.cos(s.theta * s.sign), sin = Math.sin(s.theta * s.sign);
        const gx = s.grab.x - s.hinge.x, gy = s.grab.y - s.hinge.y;
        const wx = s.point.x - s.hinge.x - (gx * cos - gy * sin);
        const wy = s.point.y - s.hinge.y - (gx * sin + gy * cos);
        s.sx += (wx - s.sx) * (1 - Math.exp(-dt / 0.045));
        s.sy += (wy - s.sy) * (1 - Math.exp(-dt / 0.045));
        const hang = limit * 0.55 + clamp(s.pvx * 0.0009 * s.sign, -0.3, 0.3);
        s.theta += (hang - s.theta) * (1 - Math.exp(-dt / 0.12));
      } else if (s.phase === 'drop') {
        s.age += dt;
        s.vy += GRAVITY * dt;
        s.sx += s.vx * dt; s.sy += s.vy * dt;
        s.theta += s.spin * dt;
        if (s.age > 0.16) s.fade = clamp(1 - (s.age - 0.16) / 0.42, 0, 1);
        if (s.fade <= 0) { s.phase = 'idle'; finish(); }
      } else if (s.phase === 'return') {
        s.theta += (0 - s.theta) * (1 - Math.exp(-dt / 0.09));
        s.sx += (0 - s.sx) * (1 - Math.exp(-dt / 0.07));
        s.sy += (0 - s.sy) * (1 - Math.exp(-dt / 0.07));
        if (Math.abs(s.theta) < 0.001 && Math.hypot(s.sx, s.sy) < 0.08) {
          s.theta = 0; s.sx = 0; s.sy = 0; s.phase = 'idle';
        }
      }

      /* 纸面震颤（断开时的回弹） */
      s.bv += (-520 * s.bx - 30 * s.bv) * dt;
      s.bx += s.bv * dt;

      const busy = paint(now);
      const moving = Math.abs(s.bx) > 0.02 || Math.abs(s.bv) > 0.5;
      if (s.phase !== 'idle' || moving || busy) s.raf = requestAnimationFrame(step);
      else {
        s.bx = 0; s.bv = 0; paint(now); s.raf = 0;
      }
    }
    function run() {
      if (s.raf) return;
      s.last = performance.now();
      s.raf = requestAnimationFrame(step);
    }
    function stop() {
      if (s.raf) cancelAnimationFrame(s.raf);
      s.raf = 0;
    }
    function hideFibres() { fibres.forEach(p => { p.style.opacity = '0'; }); }

    /* ---------- 3D 倾斜 + 图面视差 ---------- */
    let tiltX = 0, tiltY = 0, goalX = 0, goalY = 0, tiltRaf = 0;
    const depth = PARALLAX / TILT_MAX;
    function applyTilt() {
      plane.style.transform = 'perspective(' + PERSPECTIVE + 'px) rotate(' + ROTATE + 'deg) rotateX('
        + tiltX.toFixed(2) + 'deg) rotateY(' + tiltY.toFixed(2) + 'deg)';
      const ax = -tiltY * depth, ay = tiltX * depth;
      image.style.transform = 'translate3d(' + ax.toFixed(2) + 'px,' + ay.toFixed(2) + 'px,0)';
      content.style.transform = 'translate3d(' + (tiltY * depth * 0.22).toFixed(2) + 'px,'
        + (-tiltX * depth * 0.22).toFixed(2) + 'px,0)';
    }
    function tiltLoop() {
      const k = 0.14;
      tiltX += (goalX - tiltX) * k;
      tiltY += (goalY - tiltY) * k;
      applyTilt();
      if (Math.abs(goalX - tiltX) > 0.02 || Math.abs(goalY - tiltY) > 0.02) {
        tiltRaf = requestAnimationFrame(tiltLoop);
      } else { tiltX = goalX; tiltY = goalY; applyTilt(); tiltRaf = 0; }
    }
    function tiltTo(x, y) {
      goalX = x; goalY = y;
      if (!tiltRaf) tiltRaf = requestAnimationFrame(tiltLoop);
    }
    applyTilt();
    if (!reduceMotion) {
      window.addEventListener('pointermove', e => {
        if (e.pointerType === 'touch' || s.id !== null || torn) return;
        if (!ttPop.classList.contains('show')) return;
        const r = root.getBoundingClientRect();
        if (!r.width) return;
        const nx = clamp((e.clientX - (r.left + r.width / 2)) / (r.width / 2 + TILT_REACH), -1, 1);
        const ny = clamp((e.clientY - (r.top + r.height / 2)) / (r.height / 2 + TILT_REACH), -1, 1);
        tiltTo(-ny * TILT_MAX, nx * TILT_MAX);
      }, { passive: true });
    }

    /* ---------- 指针交互 ---------- */
    function local(e) {
      const r = stage.getBoundingClientRect(), k = r.width / W || 1;
      return { x: (e.clientX - r.left) / k, y: (e.clientY - r.top) / k };
    }
    function onDown(e) {
      if (torn || e.button !== 0 || s.id !== null || s.phase === 'drop') return;
      try { stubPiece.setPointerCapture(e.pointerId); } catch (err) {}
      const p = local(e);
      s.id = e.pointerId; s.start = p; s.point = { x: p.x, y: p.y };
      s.pt = performance.now(); s.pvx = 0; s.pvy = 0; s.auto = 0;
      if (s.theta < 0.01) {
        const far = p.y < geo.cross / 2;
        const end = geo.bridges[far ? geo.bridges.length - 1 : 0];
        s.sign = far ? 1 : -1;
        s.hinge = { x: end.x, y: far ? H - NOTCH : NOTCH };
        s.hingeV = end.mid;
        stubPiece.style.transformOrigin = s.hinge.x + 'px ' + s.hinge.y + 'px';
      }
      const cos = Math.cos(-s.theta * s.sign), sin = Math.sin(-s.theta * s.sign);
      const ux = p.x - s.sx - s.hinge.x, uy = p.y - s.sy - s.hinge.y;
      s.grab = { x: s.hinge.x + ux * cos - uy * sin, y: s.hinge.y + ux * sin + uy * cos };
      s.a0 = Math.atan2(s.grab.y - s.hinge.y, s.grab.x - s.hinge.x) - (s.theta * s.sign) / 0.92;
      s.phase = 'held';
      root.setAttribute('data-grabbing', '');
      tiltTo(0, 0);
      run();
    }
    function onMove(e) {
      if (s.id !== e.pointerId) return;
      const p = local(e), now = performance.now();
      const dt = Math.max(0.004, (now - s.pt) / 1000);
      s.pvx += ((p.x - s.point.x) / dt - s.pvx) * 0.35;
      s.pvy += ((p.y - s.point.y) / dt - s.pvy) * 0.35;
      s.pt = now;
      s.point = { x: p.x, y: p.y };
    }
    function onUp(e) {
      if (s.id !== e.pointerId) return;
      const dx = s.point.x - s.start.x, dy = s.point.y - s.start.y;
      const dist = Math.hypot(dx, dy);
      s.id = null;
      try { if (stubPiece.hasPointerCapture(e.pointerId)) stubPiece.releasePointerCapture(e.pointerId); } catch (err) {}
      root.removeAttribute('data-grabbing');
      if (dist < 7 && s.phase === 'held') { startAuto(dx >= 0 ? 1 : -1); return; }
      if (s.phase === 'free') {
        const still = performance.now() - s.pt > 80;
        s.vx = still ? 0 : clamp(s.pvx, -1600, 1600);
        s.vy = still ? 0 : clamp(s.pvy, -1600, 1200);
        s.spin = clamp(s.vx * 0.004, -6, 6) + 1.2 * s.sign;
        s.age = 0; s.phase = 'drop';
      } else if (s.phase === 'held') {
        // 已经撕断过桥（纸已破）：松手顺势自动撕完，不再整段弹回
        const anySnapped = s.snapped.some(Boolean);
        if (anySnapped) { startAuto(dx >= 0 ? 1 : -1); return; }
        s.phase = 'return';
      }
      run();
    }
    /* 纯点击：沿拖动方向自动撕下，全程仍是真实断桥与回缩 */
    function startAuto(dir) {
      const cos = Math.cos(-s.theta * s.sign), sin = Math.sin(-s.theta * s.sign);
      const dx = s.grab.x - s.hinge.x, dy = s.grab.y - s.hinge.y;
      s.point = { x: s.hinge.x + dx * cos - dy * sin + s.sx, y: s.hinge.y + dx * sin + dy * cos + s.sy };
      s.start = { x: s.point.x, y: s.point.y };
      s.auto = 1;
      s.autoT0 = performance.now();
      s.autoX = 150 * (dir < 0 ? -1 : 1);
      s.phase = 'held';
      run();
    }

    function finish() {
      stubPiece.style.visibility = 'hidden';
      if (torn) return;
      torn = true;
      root.setAttribute('data-torn', '');
      enterFromTicket();
    }

    stubPiece.addEventListener('pointerdown', onDown);
    stubPiece.addEventListener('pointermove', onMove);
    stubPiece.addEventListener('pointerup', onUp);
    stubPiece.addEventListener('pointercancel', onUp);
    stubPiece.addEventListener('keydown', e => {
      if (torn || (e.key !== 'Enter' && e.key !== ' ')) return;
      e.preventDefault();
      if (e.repeat) return;
      if (reduceMotion) {
        for (let i = 0; i < n; i++) { s.snapped[i] = true; s.snapAt[i] = performance.now(); }
        hideFibres(); stubPiece.style.visibility = 'hidden'; finish();
      } else { startAuto(1); }
    });
    stubPiece.addEventListener('dragstart', e => e.preventDefault());

    /* ---------- 撕下 → 图面放大 → 开始界面 ---------- */
    function enterFromTicket() {
      if (done) return;
      done = true;
      stop();
      stubPiece.style.visibility = 'hidden';
      activateScene(scene.key);            // 先切到对应场景：换画、热点、乐器简介、intro

      const r = art.getBoundingClientRect();
      const vw = document.documentElement.clientWidth || window.innerWidth;
      const vh = document.documentElement.clientHeight || window.innerHeight;

      /* 前景 FLIP 层：严格以画芯矩形为起点，object-fit 与票根一致，起飞瞬间无缝 */
      const zoom = document.createElement('div');
      zoom.className = 'tt-zoom';
      const flipper = document.createElement('div');
      flipper.className = 'tt-zoom__flipper';
      const zimg = document.createElement('img');
      zimg.src = scene.img; zimg.alt = scene.ticketAlt; zimg.draggable = false;
      flipper.appendChild(zimg); zoom.appendChild(flipper);
      zoom.style.left = r.left + 'px';
      zoom.style.top = r.top + 'px';
      zoom.style.width = r.width + 'px';
      zoom.style.height = r.height + 'px';
      zoom.style.borderRadius = '8px';
      /* 全屏清晰层：与 FLIP 终点同图同裁切，放大尾声交叉淡入接手 */
      const sharp = document.createElement('img');
      sharp.className = 'tt-zoom-sharp';
      sharp.src = scene.img; sharp.alt = ''; sharp.draggable = false;
      document.body.appendChild(zoom);
      document.body.appendChild(sharp);

      const k = r.width && r.height ? Math.max(vw / r.width, vh / r.height) : 1;
      const tx = vw / 2 - (r.left + r.width / 2);
      const ty = vh / 2 - (r.top + r.height / 2);

      const welcome = document.getElementById('welcome');
      if (welcome) {
        welcome.classList.add('hide');
        setTimeout(function () { if (welcome.parentNode) welcome.parentNode.removeChild(welcome); }, 760);
      }

      let revealed = false;
      const fadeZoom = function () {
        if (!revealed) { revealed = true; revealIntro(); }
        zoom.classList.add('fade');
        sharp.classList.add('fade');
        setTimeout(function () {
          if (zoom.parentNode) zoom.parentNode.removeChild(zoom);
          if (sharp.parentNode) sharp.parentNode.removeChild(sharp);
        }, 740);
      };
      if (typeof gsap !== 'undefined' && !reduceMotion) {
        gsap.set(sharp, { opacity: 0, filter: 'brightness(.88) blur(3px)' });
        const tl = gsap.timeline({ onComplete: fadeZoom });
        /* 段一：起势推镜，圆角收平 */
        tl.to(zoom, {
          x: tx * 0.93, y: ty * 0.93, scale: k * 0.93, borderRadius: 0,
          duration: 0.62, ease: 'power2.inOut'
        }, 0)
        /* 段二：轻微过冲落定，同时清晰层交叉接手 → 终点是原生分辨率而非插值放大 */
          .to(zoom, { x: tx, y: ty, scale: k * 1.035, duration: 0.58, ease: 'power2.out' }, 0.62)
          .to(sharp, { opacity: 1, filter: 'brightness(1) blur(0px)', duration: 0.52, ease: 'power2.out' }, 0.66);
      } else {
        zoom.style.transform = 'translate(' + tx.toFixed(1) + 'px,' + ty.toFixed(1) + 'px) scale(' + k.toFixed(2) + ')';
        sharp.style.opacity = '1';
        setTimeout(fadeZoom, 420);
      }
    }

    function revealIntro() {
      const ic = document.getElementById('intro-content');
      if (!ic) return;
      ic.classList.add('in');
      if (typeof gsap === 'undefined') return;
      const h1 = ic.querySelector('h1');
      if (!h1 || h1.getAttribute('data-split') === '1') return;
      h1.setAttribute('data-split', '1');
      const chars = Array.from(h1.textContent).map(ch =>
        '<span style="display:inline-block;white-space:pre">' + (ch === ' ' ? '&nbsp;' : ch) + '</span>'
      ).join('');
      h1.innerHTML = chars;
      gsap.fromTo(h1.querySelectorAll('span'),
        { autoAlpha: 0, y: 44, filter: 'blur(5px)' },
        { autoAlpha: 1, y: 0, filter: 'blur(0px)', duration: 1.3, ease: 'power2.out',
          stagger: { each: 0.038, from: 'start' }, delay: 0.16, overwrite: true });
    }

    root.__sceneKey = scene.key;
    return root;
  }

  // 两张票根并排供选择：合乐图 / 宫乐图
  [SCENES.hele, SCENES.gongle].forEach(function (sc) { ttPop.appendChild(buildTicket(sc)); });

  /* 票根显隐由文件夹弹簧引擎在翻盖掀到一半时触发（folder:open / ttPop.show） */
})();

/* ============ 票根出场：Folder intro 相位机 + 240Hz 弹簧（flap / spread） ============
   与文件夹共用同一套运动模型：wait → run → done；逆序错峰 dropAt(rank)、
   introPose（上方偏移 + 交替倾角 + 略放大 + alpha 0）、落地速度回弹、
   appear = 1-(1-t)^3 整体缓入。仅改运动，不改颜色 / 文字 / 图片。 */
(function ticketIntro() {
  const pop = document.getElementById('ttPop');
  if (!pop) return;
  const nodes = Array.prototype.slice.call(pop.querySelectorAll('.tt'));
  if (!nodes.length) return;

  const reduce = window.matchMedia('(prefers-reduced-motion: reduce)').matches;
  const TAU = Math.PI * 2, STEP = 1 / 240;
  const clamp = (v, lo, hi) => Math.min(hi, Math.max(lo, v));
  const spring = v => ({ value: v, velocity: 0 });
  const SPEED = 1, BOUNCE = 0.4;
  const count = nodes.length;
  const APPEAR_AT = 0.34 / SPEED;
  /* Folder: dropAt(rank) = (0.16 + (count-1-rank)*0.085) / speed —— 逆序逐张落下 */
  const dropAt = rank => (0.16 + (count - 1 - rank) * 0.085) / SPEED;
  const DONE_AT = (0.16 + count * 0.085 + 0.3) / SPEED + 0.9;
  const REST = { x: 0, y: 0, r: 0, s: 1, alpha: 1 };

  /* Folder 的 introPose：落位前先抬高、加交替倾角、略放大，且完全透明 */
  function introPose(rank) {
    return {
      x: rank % 2 ? 14 : -14,
      y: -124 - (count - 1 - rank) * 22,
      r: (rank % 2 ? 7 : -7) + (rank % 2 ? 9 : -7),
      s: 1.12,
      alpha: 0
    };
  }

  const I = {
    raf: 0, last: 0, phase: 'wait', start: 0,
    items: nodes.map((node, rank) => ({
      node: node, rank: rank,
      x: spring(0), y: spring(0), r: spring(0), s: spring(1), alpha: spring(1)
    }))
  };

  /* 240Hz 子步半隐式欧拉，与文件夹引擎同一套积分器 */
  function integrate(item, target, omega, zeta, dt) {
    const k = omega * omega, d = 2 * zeta * omega;
    const steps = Math.max(1, Math.ceil(dt / STEP)), step = dt / steps;
    for (let i = 0; i < steps; i++) {
      item.velocity += (k * (target - item.value) - d * item.velocity) * step;
      item.value += item.velocity * step;
    }
    return Math.abs(target - item.value) > 0.01 || Math.abs(item.velocity) > 0.01;
  }
  function snap(item, v) { item.value = v; item.velocity = 0; }
  function pose(item, p) {
    snap(item.x, p.x); snap(item.y, p.y); snap(item.r, p.r);
    snap(item.s, p.s); snap(item.alpha, p.alpha);
  }

  function write() {
    I.items.forEach(it => {
      it.node.style.transform = 'translate3d(' + it.x.value.toFixed(2) + 'px,' + it.y.value.toFixed(2)
        + 'px,0) scale(' + it.s.value.toFixed(4) + ') rotate(' + it.r.value.toFixed(3) + 'deg)';
      it.node.style.opacity = clamp(it.alpha.value, 0, 1).toFixed(3);
    });
  }

  /* 先写入入场位姿：此后 .tt-pop.show 的 CSS 终态不会造成一帧闪现 */
  I.items.forEach(it => pose(it, introPose(it.rank)));
  write();

  function settle() {
    I.phase = 'done';
    I.items.forEach(it => { it.node.style.transform = ''; it.node.style.opacity = ''; });
    pop.style.opacity = '';
  }

  function frame(now) {
    I.raf = 0;
    const dt = I.last ? Math.min(0.05, (now - I.last) / 1000) : 1 / 60;
    I.last = now;
    const t = now / 1000 - I.start;
    let busy = t < DONE_AT;

    /* Folder 的整体淡入：appear = 1 - (1 - t / 0.34)^3 */
    pop.style.opacity = (1 - Math.pow(1 - clamp(t / APPEAR_AT, 0, 1), 3)).toFixed(3);

    const zeta = 1 - 0.72 * BOUNCE;
    const omega = TAU * 2.1 * SPEED;
    const alphaOmega = TAU * 3 * SPEED;
    I.items.forEach(it => {
      const staged = t < dropAt(it.rank);
      const target = staged ? introPose(it.rank) : REST;
      busy = integrate(it.x, target.x, omega, zeta, dt) || busy;
      busy = integrate(it.y, target.y, omega, zeta, dt) || busy;
      busy = integrate(it.r, target.r, omega, zeta, dt) || busy;
      busy = integrate(it.s, target.s, omega, zeta, dt) || busy;
      busy = integrate(it.alpha, target.alpha, alphaOmega, 1, dt) || busy;
      /* Folder 的落地约束：越过静止面即夹住，并按 -0.25 给一点回弹 */
      if (!staged && it.y.value > REST.y) {
        it.y.value = REST.y;
        if (it.y.velocity > 0) it.y.velocity *= -0.25;
      }
      if (staged) busy = true;
    });
    write();
    if (busy) I.raf = requestAnimationFrame(frame);
    else { I.last = 0; settle(); }
  }

  function begin() {
    if (I.phase !== 'wait') return;
    if (reduce) { settle(); I.phase = 'done'; return; }
    I.phase = 'run';
    I.start = performance.now() / 1000;
    I.last = 0;
    I.raf = requestAnimationFrame(frame);
  }

  window.addEventListener('folder:open', begin);
  if (pop.classList.contains('show')) begin();
})();

// 初始化默认场景（合乐图）：重渲热点/索引并配置开始界面背景
activateScene(sceneKey);

/* ===== SpecularButton 高光：给 .specular 按钮注入高光层并跟随鼠标 ===== */
(function specular() {
  const SEL = '.specular';
  function ensure(btn) {
    if (!btn || btn.querySelector('.specular__light')) return;
    const l = document.createElement('span');
    l.className = 'specular__light';
    l.setAttribute('aria-hidden', 'true');
    btn.appendChild(l);
  }
  document.querySelectorAll(SEL).forEach(ensure);
  document.addEventListener('pointermove', (e) => {
    const t = e.target;
    const btn = (t && t.closest) ? t.closest(SEL) : null;
    if (!btn) return;
    const r = btn.getBoundingClientRect();
    if (!r.width) return;
    btn.style.setProperty('--sb-x', (((e.clientX - r.left) / r.width) * 100).toFixed(2) + '%');
    btn.style.setProperty('--sb-y', (((e.clientY - r.top) / r.height) * 100).toFixed(2) + '%');
  }, { passive: true });
  const mo = new MutationObserver((muts) => {
    muts.forEach(m => m.addedNodes.forEach(n => {
      if (n.nodeType !== 1) return;
      if (n.matches && n.matches(SEL)) ensure(n);
      if (n.querySelectorAll) n.querySelectorAll(SEL).forEach(ensure);
    }));
  });
  mo.observe(document.body, { childList: true, subtree: true });
})();

/* ===== 加载界面：首屏画卷解码 + 字体就绪即淡出（不空等全部资源） ===== */
(function () {
  const finish = () => {
    const l = document.getElementById('loader');
    if (!l || l.classList.contains('loader--done')) return;
    l.classList.add('loader--done');
    setTimeout(() => { const el = document.getElementById('loader'); if (el) el.remove(); }, 700);
    // 帷幕与 loader 无缝衔接：加载结束即开幕，慢网不再黑屏等待
    const curtain = document.getElementById('curtain');
    if (curtain) {
      setTimeout(() => {
        curtain.classList.add('open');
        setTimeout(() => { if (curtain.parentNode) curtain.remove(); }, 2200);
      }, 150);
    }
  };
  const withTimeout = (p, ms) => Promise.race([p, new Promise(r => setTimeout(r, ms))]);
  const paintingImg = document.getElementById('paintingImg');
  const paintingReady = paintingImg
    ? __loadImg(paintingImg, document.getElementById('painting'), 'hele')
    : Promise.resolve(true);
  const fontsReady = withTimeout((document.fonts && document.fonts.ready) || Promise.resolve(), 2500);
  withTimeout(Promise.all([paintingReady, fontsReady]), 6500).then(() => setTimeout(finish, 250));
  setTimeout(finish, 9000); // 兜底：极端情况下最多 9s
})();

/* ===== 空闲预取：另一幅画卷 / intro 分段 / 全部乐器大图，进入详情与换画零等待 ===== */
(function () {
  const urls = ['assets/gongle.webp',
    'assets/intro_seg0.webp', 'assets/intro_seg1.webp', 'assets/intro_seg2.webp', 'assets/intro_seg3.webp'];
  [SCENES.hele, SCENES.gongle].forEach(sc =>
    (sc.instruments || []).forEach(it => urls.push('assets/' + it.id + '.webp')));
  const queue = [...new Set(urls)];
  let i = 0;
  function step(deadline) {
    // 每个空闲切片取几张，不与交互抢主线程
    const take = deadline && deadline.timeRemaining ? Math.max(1, Math.floor(deadline.timeRemaining() / 6)) : 2;
    for (let k = 0; k < take && i < queue.length; k++, i++) {
      const im = new Image();
      im.decoding = 'async';
      im.src = queue[i];
    }
    if (i < queue.length) schedule();
  }
  function schedule() {
    if ('requestIdleCallback' in window) requestIdleCallback(step, { timeout: 30000 });
    else setTimeout(() => step(null), 400);
  }
  const start = () => setTimeout(schedule, 2500); // 首屏稳定后再后台预取
  if (document.readyState === 'complete') start();
  else window.addEventListener('load', start, { once: true });
})();
